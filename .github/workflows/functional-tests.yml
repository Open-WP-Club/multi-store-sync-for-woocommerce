name: PHP Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  PHP_VERSION: '8.4'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, curl
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.composer-cache.outputs.dir }}
            vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check PHP syntax
        run: vendor/bin/parallel-lint --exclude vendor --exclude node_modules .

      - name: Run PHPStan
        run: composer phpstan

      - name: Run PHPCS (WordPress security/DB conventions)
        run: composer phpcs
        continue-on-error: true # advisory only — no baseline mechanism exists yet to freeze the ~690 pre-existing findings; see .claude.md

      - name: Cache PHPUnit results
        uses: actions/cache@v5
        with:
          path: .phpunit.cache
          key: ${{ runner.os }}-phpunit-${{ hashFiles('**/phpunit.xml.dist') }}
          restore-keys: |
            ${{ runner.os }}-phpunit-

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit --testsuite Unit

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run JS tests
        run: npm test
